<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Телелента</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #000;
    }

    h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .post {
      padding: 12px;
      border-bottom: 1px solid #e6e6e6;
      cursor: pointer;
    }

    .post:active {
      background: #f2f2f2;
    }

    .channel {
      font-weight: 600;
      color: #0088cc;
      margin-bottom: 4px;
    }

    .text {
      font-size: 15px;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <h3>Лента каналов</h3>
  <div id="feed">Загрузка…</div>

  <script>
    // Инициализация Telegram Mini App
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    // Тестовые данные (MVP)
    const posts = [
      {
        channel: "@telegram",
        text: "Обновление Telegram",
        link: "https://t.me/telegram"
      },
      {
        channel: "@durov",
        text: "Пост Павла Дурова",
        link: "https://t.me/durov"
      }
    ];

    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    // Рендер ленты
    posts.forEach(post => {
      const card = document.createElement("div");
      card.className = "post";

      card.innerHTML = `
        <div class="channel">${post.channel}</div>
        <div class="text">${post.text}</div>
      `;

      // Клик → открыть канал в Telegram
      card.onclick = () => {
        Telegram.WebApp.openLink(post.link);
      };

      feed.appendChild(card);
    });
  </script>

</body>
</html>
