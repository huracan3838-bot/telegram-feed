<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Telegram Channel Feed</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #ffffff;
    }
    .post {
      border-bottom: 1px solid #ddd;
      padding: 15px 0;
    }
    .channel {
      font-weight: bold;
      color: #0088cc;
    }
  </style>
</head>

<body>
  <h3>Лента каналов</h3>
  <div id="feed"></div>

  <script>
    const tg = Telegram.WebApp;
    tg.expand(); // разворачивает Mini App

    // ВРЕМЕННЫЕ ДАННЫЕ (для MVP)
    const posts = [
      { channel: "@telegram", text: "Обновление Telegram" },
      { channel: "@durov", text: "Пост Павла Дурова" }
    ];

    const feed = document.getElementById("feed");

    posts.forEach(post => {
      const div = document.createElement("div");
      div.className = "post";
      div.innerHTML = `
        <div class="channel">${post.channel}</div>
        <div>${post.text}</div>
      `;
      feed.appendChild(div);
    });
  </script>
</body>
</html>
