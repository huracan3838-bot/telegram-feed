<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Телелента</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, Arial;
      background: #fff;
    }
    .post {
      padding: 12px;
      border-bottom: 1px solid #e6e6e6;
      cursor: pointer;
    }
    .post:active { background: #f2f2f2; }
    .channel { font-weight: 600; color: #0088cc; }
    .text { margin-top: 4px; }
    input, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

<h3>Лента каналов</h3>

<input id="channelInput" placeholder="@telegram" />
<button onclick="addChannel()">Добавить канал</button>

<div id="feed">Загрузка…</div>

<script>
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();

  let channels = JSON.parse(localStorage.getItem("channels") || "[]");

  function addChannel() {
    const ch = document.getElementById("channelInput").value.trim();
    if (!ch.startsWith("@")) return alert("Введите @канал");
    channels.push(ch);
    localStorage.setItem("channels", JSON.stringify(channels));
    loadFeed();
  }

  async function loadFeed() {
    document.getElementById("feed").innerHTML = "Загрузка…";

    const res = await fetch("https://YOUR_SERVER_URL/feed", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ channels })
    });

    const posts = await res.json();
    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    posts.forEach(p => {
      const div = document.createElement("div");
      div.className = "post";
      div.innerHTML = `
        <div class="channel">${p.channel}</div>
        <div class="text">${p.text}</div>
      `;
      div.onclick = () => Telegram.WebApp.openLink(p.link);
      feed.appendChild(div);
    });
  }

  loadFeed();
</script>

</body>
</html>
